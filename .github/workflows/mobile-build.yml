name: Build Android App

on:
  push:
    branches: [ private_build ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ private_build ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Build web application
      run: npm run build
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Build Android AAB (Release)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd android
        ./gradlew bundleRelease
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload AAB artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: android-aab
        path: android/app/build/outputs/bundle/release/app-release.aab

  # Create release with built apps
  create-release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./releases/
        
    - name: Download Android AAB
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/download-artifact@v4
      with:
        name: android-aab
        path: ./releases/
        
    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Claude Code UI ${{ steps.tag.outputs.TAG_NAME }}
        body: |
          ## Claude Code UI Mobile Release ${{ steps.tag.outputs.TAG_NAME }}
          
          ### 📱 Mobile Applications
          - **Android APK**: Debug build for testing
          - **Android AAB**: Production build for Google Play Store
          
          ### 🚀 Features
          - Full Claude Code CLI integration
          - Native mobile optimizations
          - Touch-friendly interface
          - Haptic feedback support
          - Network status monitoring
          - Platform-specific UI adaptations
          
          ### 📋 Installation
          
          **Android:**
          1. Download the APK file
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK file
          
          ### 🔧 Technical Details
          - Built with Capacitor 6
          - React 18 + Vite + TailwindCSS
          - Node.js backend with WebSocket support
          - SQLite database for authentication
          
          ---
          
          **Full Changelog**: https://github.com/dbds-team/my_ccui/commits/${{ steps.tag.outputs.TAG_NAME }}
        files: |
          releases/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}