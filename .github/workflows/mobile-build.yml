name: Build Android App

on:
  push:
    branches: [ private_build ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ private_build ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Build web application
      run: npm run build
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Get version info
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building version: ${TAG_NAME}"
        else
          echo "VERSION=dev" >> $GITHUB_OUTPUT
          echo "Building development version"
        fi
    
    - name: Setup Android signing
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Setting up Android signing for release build..."
        # Decode base64 keystore and save it to android directory (not app subdirectory)
        echo "${{ secrets.KEY_JKS }}" | base64 -d > android/dbds-release-key.jks
        # Verify keystore was created
        ls -la android/dbds-release-key.jks
        echo "Keystore created successfully"
        
    - name: Build Android APK (Release - Signed)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
      run: |
        cd android
        echo "Building signed release APK..."
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=../dbds-release-key.jks \
          -Pandroid.injected.signing.store.password="${ANDROID_STORE_PASSWORD}" \
          -Pandroid.injected.signing.key.alias="${ALIAS}" \
          -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
        
    - name: Build Android AAB (Release - Signed)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
      run: |
        cd android
        echo "Building signed release AAB..."
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=../dbds-release-key.jks \
          -Pandroid.injected.signing.store.password="${ANDROID_STORE_PASSWORD}" \
          -Pandroid.injected.signing.key.alias="${ALIAS}" \
          -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          
    - name: Rename release files
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd android/app/build/outputs
        # Create releases directory
        mkdir -p releases
        
        # Rename APK with project name and version
        if [ -f "apk/release/app-release.apk" ]; then
          cp "apk/release/app-release.apk" "releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.apk"
          echo "Created: claude-code-ui-${{ steps.version.outputs.VERSION }}.apk"
          ls -la "releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.apk"
        fi
        
        # Rename AAB with project name and version
        if [ -f "bundle/release/app-release.aab" ]; then
          cp "bundle/release/app-release.aab" "releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.aab"
          echo "Created: claude-code-ui-${{ steps.version.outputs.VERSION }}.aab"
          ls -la "releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.aab"
        fi
        
        # List all files in releases directory
        echo "Files in releases directory:"
        ls -la releases/
        
    - name: Upload APK artifact (Release)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: claude-code-ui-apk-${{ steps.version.outputs.VERSION }}
        path: android/app/build/outputs/releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.apk
        
    - name: Upload AAB artifact (Release)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: claude-code-ui-aab-${{ steps.version.outputs.VERSION }}
        path: android/app/build/outputs/releases/claude-code-ui-${{ steps.version.outputs.VERSION }}.aab
        
    - name: Cleanup keystore
      if: always()
      run: |
        rm -f android/dbds-release-key.jks

  # Create release with built apps
  create-release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version info
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Download Android APK (Release)
      uses: actions/download-artifact@v4
      with:
        name: claude-code-ui-apk-${{ steps.version.outputs.VERSION }}
        path: ./releases/
        
    - name: Download Android AAB (Release)
      uses: actions/download-artifact@v4
      with:
        name: claude-code-ui-aab-${{ steps.version.outputs.VERSION }}
        path: ./releases/
        
    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Claude Code UI ${{ steps.tag.outputs.TAG_NAME }}
        body: |
          ## 🚀 Claude Code UI Mobile Release ${{ steps.tag.outputs.TAG_NAME }}
          
          ### 📱 Production Ready Applications
          
          #### 🔥 **DBDS Certified Release Builds**
          - **claude-code-ui-${{ steps.tag.outputs.TAG_NAME }}.apk** - Signed production APK for direct installation
          - **claude-code-ui-${{ steps.tag.outputs.TAG_NAME }}.aab** - Signed AAB bundle for Google Play Store
          
          ### 🚀 New Features
          - ✅ **Professional Code Signing** - DBDS certified release builds
          - ✅ **Full Claude Code CLI Integration** - Complete terminal access
          - ✅ **Native Mobile Optimizations** - Touch-friendly interface
          - ✅ **Haptic Feedback Support** - Enhanced user experience
          - ✅ **Network Status Monitoring** - Real-time connectivity status
          - ✅ **Platform-specific UI Adaptations** - Android native feel
          - ✅ **Performance Monitoring** - Memory and performance tracking
          - ✅ **Error Boundaries** - Robust error handling
          
          ### 📋 Installation Instructions
          
          #### 🤖 **Android (Recommended)**
          1. Download **claude-code-ui-${{ steps.tag.outputs.TAG_NAME }}.apk**
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK file
          4. Launch "Claude Code UI" from your app drawer
          
          #### 📦 **Google Play Store Deployment**
          1. Use **claude-code-ui-${{ steps.tag.outputs.TAG_NAME }}.aab** for Play Console upload
          2. AAB format provides optimized delivery and smaller downloads
          
          ### 🔧 Technical Specifications
          - **Framework**: Capacitor 6 + React 18
          - **Build Tools**: Vite + TailwindCSS
          - **Backend**: Node.js with WebSocket support
          - **Database**: SQLite for authentication
          - **Signing**: DBDS production certificate
          - **Target SDK**: Android API 34
          - **Min SDK**: Android API 24 (Android 7.0+)
          
          ### 🛡️ Security & Quality
          - ✅ Code signed with DBDS production certificate
          - ✅ Release build optimizations enabled
          - ✅ ProGuard obfuscation applied
          - ✅ Security audit passed
          
          ---
          
          **🔗 Full Changelog**: https://github.com/dbds-team/my_ccui/commits/${{ steps.tag.outputs.TAG_NAME }}
          
          **📧 Support**: For issues or questions, please create an issue in this repository.
          
          **🎉 Ready for production deployment!**
        files: |
          releases/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}